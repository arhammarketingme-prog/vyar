<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1 style="color:var(--vyra-accent);">VYRA</h1>
    <div class="card">
      <h2>Reset your password</h2>
      <form id="forgot-form">
        <input type="email" name="email" placeholder="Email" required>
        <div id="forgot-error" class="error hidden"></div>
        <button type="submit" class="btn">Send reset link</button>
      </form>
    </div>
    <p class="muted"><a href="login.html" style="color:var(--vyra-accent);">Back to log in</a></p>
  </div>
  <script type="module">
    import { initForgotPassword } from "../js/forgot-password.js";
    initForgotPassword();
  </script>
</body>
</html>
