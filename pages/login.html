<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#f0a83a">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<title>Log in — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px;">
      <svg width="34" height="34" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="vyra-bg" cx="32%" cy="22%" r="95%"><stop offset="0" stop-color="#1f222c"/><stop offset="1" stop-color="#14161d"/></radialGradient>
          <linearGradient id="vyra-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5bd5c"/><stop offset="0.55" stop-color="#f0a83a"/><stop offset="1" stop-color="#d9536f"/></linearGradient>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#vyra-bg)"/>
        <path d="M 146 132 Q 210 300 256 372 Q 302 300 366 132" fill="none" stroke="url(#vyra-mark)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="378" cy="104" r="17" fill="#2fa89a"/>
      </svg>
      <h1 style="color:var(--vyra-accent); margin:0;">VYRA</h1>
    </div>
    <div class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <div id="login-error" class="error hidden"></div>
        <button type="submit" class="btn">Log in</button>
      </form>
      <div style="text-align:center; margin:12px 0; color:var(--vyra-text-dim); font-size:13px;">or</div>
      <button id="google-login-btn" class="btn btn-secondary" style="margin-bottom:8px;">Continue with Google</button>
      <button id="facebook-login-btn" class="btn btn-secondary">Continue with Facebook</button>
    </div>
    <p class="muted">New here? <a href="signup.html" style="color:var(--vyra-accent);">Create an account</a></p>
    <p class="muted"><a href="forgot-password.html" style="color:var(--vyra-accent);">Forgot password?</a></p>
  </div>
  <script type="module">
    import { bindLoginForm, signInWithGoogle, signInWithFacebook } from "../js/auth.js";
    bindLoginForm(document.getElementById("login-form"), document.getElementById("login-error"));

    document.getElementById("google-login-btn").addEventListener("click", async () => {
      try { await signInWithGoogle(); } catch (err) { alert(err.message); }
    });
    document.getElementById("facebook-login-btn").addEventListener("click", async () => {
      try { await signInWithFacebook(); } catch (err) { alert(err.message); }
    });
  </script>
</body>
</html>
