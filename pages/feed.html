<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#f0a83a">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<title>Feed — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1 style="color:var(--vyra-accent); font-size:22px; display:flex; justify-content:space-between; align-items:center;">
      VYRA
      <a href="notifications.html" id="bell-link" style="font-size:20px; text-decoration:none; position:relative;">
        🔔<span id="bell-badge" class="hidden" style="position:absolute; top:-4px; right:-8px; background:var(--vyra-accent); color:var(--vyra-accent-ink); font-weight:700; font-size:10px; border-radius:10px; padding:1px 5px;"></span>
      </a>
    </h1>
    <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
      <a href="reels.html" class="btn btn-secondary" style="width:auto; padding:6px 14px; font-size:13px;">🎬 <span data-i18n="reels">Reels</span></a>
      <a href="collections.html" class="btn btn-secondary" style="width:auto; padding:6px 14px; font-size:13px;">📁 <span data-i18n="collections">Collections</span></a>
      <a href="communities.html" class="btn btn-secondary" style="width:auto; padding:6px 14px; font-size:13px;">👥 <span data-i18n="communities">Communities</span></a>
      <a href="messages.html" class="btn btn-secondary" style="width:auto; padding:6px 14px; font-size:13px;">💬 <span data-i18n="messages">Messages</span></a>
    </div>
    <div id="stories-bar" class="story-bar"></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button id="tab-foryou" class="btn" style="width:auto; padding:6px 16px; font-size:13px;" data-i18n="for_you">For You</button>
      <button id="tab-following" class="btn btn-secondary" style="width:auto; padding:6px 16px; font-size:13px;" data-i18n="following">Following</button>
      <button id="tab-recommended" class="btn btn-secondary" style="width:auto; padding:6px 16px; font-size:13px;" data-i18n="recommended">Recommended</button>
    </div>
    <div id="feed"></div>
  </div>
  <nav class="bottom-nav">
    <a href="feed.html" class="active">🏠</a>
    <a href="explore.html">🔍</a>
    <a href="create-post.html">➕</a>
    <a href="profile.html">👤</a>
  </nav>
  <script type="module">
    import { initFeed, loadRecommended, loadFollowing } from "../js/feed.js";
    import { initStoriesBar } from "../js/stories-bar.js";
    import { translatePage } from "../js/i18n.js";
    translatePage();
    initFeed();
    initStoriesBar();

    import("../js/supabaseClient.js").then(async ({ supabase }) => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const { count } = await supabase
        .from("notifications")
        .select("*", { count: "exact", head: true })
        .eq("recipient_id", session.user.id)
        .is("read_at", null);
      if (count > 0) {
        const badge = document.getElementById("bell-badge");
        badge.textContent = count > 9 ? "9+" : count;
        badge.classList.remove("hidden");
      }
    });

    const tabs = ["tab-foryou", "tab-following", "tab-recommended"];
    function activateTab(id) {
      tabs.forEach((t) => document.getElementById(t).classList.toggle("btn-secondary", t !== id));
      document.getElementById("feed").innerHTML = "";
    }
    document.getElementById("tab-foryou").addEventListener("click", () => { activateTab("tab-foryou"); initFeed(); });
    document.getElementById("tab-following").addEventListener("click", () => { activateTab("tab-following"); loadFollowing(); });
    document.getElementById("tab-recommended").addEventListener("click", () => { activateTab("tab-recommended"); loadRecommended(); });
  </script>
</body>
</html>
