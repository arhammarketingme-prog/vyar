<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff5d3b">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Community — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div id="community-root">Loading...</div>

    <h3>Events</h3>
    <div id="events-list"></div>
    <div class="card">
      <form id="new-event-form">
        <input type="text" name="title" placeholder="Event title" required>
        <textarea name="description" placeholder="Description" rows="2"></textarea>
        <input type="datetime-local" name="event_time" required>
        <input type="text" name="location" placeholder="Location (optional)">
        <button type="submit" class="btn">Create event</button>
      </form>
    </div>

    <h3>Posts</h3>
    <div id="community-feed"></div>
  </div>
  <nav class="bottom-nav">
    <a href="feed.html">🏠</a>
    <a href="explore.html">🔍</a>
    <a href="create-post.html">➕</a>
    <a href="profile.html">👤</a>
  </nav>
  <script type="module">
    import { initCommunityDetail } from "../js/community-detail.js";
    initCommunityDetail();
  </script>
</body>
</html>
