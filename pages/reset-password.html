<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1 style="color:var(--vyra-accent);">VYRA</h1>
    <div class="card">
      <h2>Set a new password</h2>
      <form id="reset-form">
        <input type="password" name="password" placeholder="New password (min 8 characters)" minlength="8" required>
        <div id="reset-error" class="error hidden"></div>
        <button type="submit" class="btn">Save new password</button>
      </form>
    </div>
  </div>
  <script type="module">
    import { initResetPassword } from "../js/reset-password.js";
    initResetPassword();
  </script>
</body>
</html>
