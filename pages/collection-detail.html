<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#f0a83a">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<title>Collection — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1 id="collection-title" style="color:var(--vyra-accent); font-size:22px;">Loading...</h1>

    <div id="members-section" class="card hidden" style="margin-bottom:14px;">
      <div class="muted" style="margin-bottom:6px;">👥 Shared with</div>
      <div id="members-list" style="font-size:13px; margin-bottom:8px;"></div>
      <div id="invite-row" style="display:none; gap:8px;">
        <input type="text" id="invite-username" placeholder="Invite by username" style="margin-bottom:0;">
        <button id="invite-btn" class="btn" style="width:auto;">Invite</button>
      </div>
      <div id="invite-msg" class="muted" style="font-size:12px; margin-top:6px;"></div>
    </div>

    <div id="collection-grid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px;"></div>
  </div>
  <nav class="bottom-nav">
    <a href="feed.html">🏠</a>
    <a href="explore.html">🔍</a>
    <a href="create-post.html">➕</a>
    <a href="profile.html">👤</a>
  </nav>
  <script type="module">
    import { initCollectionDetail } from "../js/collection-detail.js";
    initCollectionDetail();
  </script>
</body>
</html>
