<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Live — VYRA</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    .live-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      padding: 20px;
      text-align: center;
    }
    #videoContainer {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 9/16;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    #videoContainer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Gemini Aurora Fluid Animated Background -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob blob-cyan"></div>
    <div class="aurora-blob blob-purple"></div>
    <div class="aurora-blob blob-amber"></div>
  </div>

  <header class="top-nav">
    <a href="../index.html" style="color: #fff; text-decoration: none; font-size: 20px;">←</a>
    <h3 style="font-weight: 600;">🔴 Go Live</h3>
    <div style="width: 24px;"></div>
  </header>

  <main class="live-container">
    <div id="videoContainer"></div>

    <input 
      type="text" 
      id="streamTitle" 
      placeholder="What's this stream about?" 
      style="width: 100%; max-width: 450px; margin-bottom: 16px;"
    />

    <button id="startLiveBtn" class="btn-primary" style="width: 100%; max-width: 450px; font-size: 16px;">
      Start Live Stream
    </button>
    <p id="errorMsg" style="color: #ef4444; margin-top: 12px; font-size: 14px;"></p>
  </main>

  <script type="module" src="../js/supabaseClient.js"></script>
  <script type="module" src="../js/go-live.js"></script>
</body>
</html>
