<style>
  body { margin: 0; padding: 0; background: black; }
  #reels-container {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
  }
  .reel-slide {
    height: 100vh;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: flex-end;
  }
  .reel-overlay {
    position: absolute;
    bottom: 70px;
    left: 16px;
    right: 16px;
    color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
