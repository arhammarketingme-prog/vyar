<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight — VYRA</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  #story-root {
    position: relative;
    aspect-ratio: 9 / 16;
    height: min(100vh, 177.78vw);
    width: min(100vw, 56.25vh);
    display: flex; flex-direction: column; justify-content: center;
    color: white; cursor: pointer; overflow: hidden;
  }
  .story-progress-row { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .story-progress-bar { height: 3px; flex: 1; background: rgba(255,255,255,0.3); border-radius: 2px; }
  .story-progress-bar.filled, .story-progress-bar.active { background: white; }
  .story-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; font-size: 24px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div id="story-root">Loading...</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { initHighlightView } from "../js/highlights.js";
    initHighlightView();
  </script>
</body>
</html>
